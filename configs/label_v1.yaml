# 라벨 함수 하이퍼파라미터 (CLAUDE.md B.4). base.yaml 위에 얹어 사용.

label:
  # 객체 카테고리 필터 (prefix 매칭). vehicle + pedestrian + cyclist(자전거는 vehicle.bicycle)
  categories: ["vehicle", "human.pedestrian"]
  max_range: 50.0          # 이보다 먼 객체 무시(m)

  # TTC / 위험 가중
  tau: 3.0                 # w(TTC)=exp(-TTC/tau) — 위험 정의(5초)와 스케일을 맞춤
  w_type: exp              # exp | inv
  # 근접 보정: 저속으로 다가가다 부딪힐 객체를 놓치지 않기 위한 하한.
  # **진행 방향 쪽 객체에만** 적용한다 — 지나쳐 온 정지 객체가 후방 채널을 켜던 문제.
  w_min_near: 0.3          # 근접 최소 가중
  near_range: 10.0         # 근접 판정 거리
  touch_range: 2.0         # 이 거리 이내면 방향과 무관하게 적용(사실상 접촉)
  v_r_min: 0.1             # 접근속도 하한(이하이면 TTC=inf)

  # 위험 재정의 — radial TTC는 길가 주차 차량을 충돌 임박으로 오판한다.
  # 실측: 정지·주차 객체가 위험량의 62.9%, 제외 시 선택 뷰가 29.4% 프레임에서 뒤집힘.
  ttc_mode: cpa            # cpa(최접근 기반, 기본) | radial(ablation)
  # DCA는 중심점 간 거리다. 차폭(1.9m)·인접 차선(3.5m)을 감안해 상수를 잡는다.
  d_near: 3.0              # 최접근 거리(DCA)가 이보다 가까우면 경로 감쇠 없음
  d_scale: 1.5             # DCA 초과분 지수 감쇠 스케일
  rho_min: 0.05            # 경로 무관 객체의 가중 하한
  # '실제 위험' 정의 — 라벨·평가·골드셋 추출이 모두 이 값을 공유한다.
  # DCA는 중심점 간 거리라 3.0m는 차폭 감안 실제 여유 약 1.1m("가까이 지나감").
  # 5초는 원격주행의 전송 지연 + 인지·판단·조작을 감안한 최소 지평.
  d_hazard: 3.0            # 위험 판정 최접근 거리
  hazard_ttc: 5.0          # 위험 판정 시간 지평
  # ρ_attr와 ρ_path를 그냥 곱하면 경로 위 주차 차량이 이중으로 깎인다.
  # 최접근이 차체 폭 수준이면 주차 여부와 무관하게 부딪힐 대상이므로 감쇠를 해제한다.
  attr_exempt_touch: 1.5   # 이 거리 이내 최접근이면 상태 감쇠 완전 해제
  attr_exempt_scale: 2.0   # 해제 감쇠 스케일 (0 = 예외 없음)
  attr_weight:             # 객체 상태별 계수 (비우면 constants의 기본값)
    vehicle.parked: 0.2
    vehicle.stopped: 0.5
    pedestrian.standing: 0.5
    pedestrian.sitting_lying_down: 0.3
    cycle.without_rider: 0.2

  # 보조 뷰 선택 — 항상 1장이 아니라 0~2장 (인지부하 ↔ 안전 트레이드오프)
  # 슬롯을 역할로 나눈다: 1번은 기동이 만드는 사각지대(보장), 나머지는 위험.
  # 하나의 임계값을 합산 점수에 걸면 기동 항이 슬롯을 독점해 위험이 밀려났다
  # (차선변경 중 위험 커버 60.6% → 역할 분리 후 70.3%).
  # 표시량이 정밀도를 결정한다(커널을 조여도 정밀도는 6.3→6.5%로 불변).
  # 평균 1.03장에서 정밀도 6.5%/재현율 96.9%, 0.60장에서 13.3%/89.9%.
  # 그 아래는 재현율이 무너진다(0.30장 → 29.5%/35.5%). 0.60장을 운영점으로 채택.
  aux_threshold: 0.12      # 위험 슬롯 임계 — **순수 위험 항** 기준(기동 항 제외)
  m_guard: 0.9             # 기동 적합도 m(c)가 이 값 이상인 채널을 사각지대로 보장
  aux_max: 2               # 동시 강조 최대 채널 수 (차선변경: 후측방 + 위험)

  # 점수 결합
  # λ=1.0이면 기동 항이 보조 슬롯 2개를 독점해 실제 위험을 밀어냈다
  # (차선변경 중 위험 커버 70.7%). λ=0.4에서 기동 기본값은 유지하면서
  # (LC 측방 0.4·후측방 0.2 > θ) 두 번째 슬롯을 위험이 가져갈 수 있다.
  lambda_m: 0.4            # s(c)=Σw + lambda·m(c)
  T_soft: 0.5              # soft_label = softmax(s / T_soft)

  # 안정화
  ema_alpha: 0.7           # scene 내 s(c) EMA 스무딩
  flicker_merge: true      # 1-keyframe 단발 전환 병합

  # 뷰 정책 (primary=진행방향 고정, attention=적응형 보조)
  stop_hold: true          # 정지 시 뷰 유지(극단 위험 제외)
  extreme_ttc: 1.5         # min_TTC 이보다 짧으면 정지 중에도 위험 뷰로 전환

  # 기동 윈도우 — 비대칭. 미래를 보는 이유는 선제적 전환이고, 과거를 같은 길이로
  # 보면 이미 끝난 기동의 꼬리가 붙어 직진 중인 프레임이 TURN으로 라벨된다
  # (scene-0415: t=0에 헤딩 변화 완료, 그런데 TURN_LEFT + 담장만 보이는 FRONT_LEFT 강조).
  maneuver_window_s: 3.0        # 하위호환 폴백
  maneuver_window_back_s: 1.0   # 과거
  # 미래 5초. 차선변경은 4~6초 기동이라 3초 창에는 절반만 담겨, 곡선로와 구분되지
  # 않았다(잔차 ≥2.5m 비율 0.28% → 5초 창에서 3.96%). 라벨이 기동보다 최대 5초
  # 앞서므로 그만큼 예측 난이도가 올라간다 — 선제적 전환을 얻는 대가다.
  maneuver_window_fwd_s: 5.0
  # STOP·REVERSE는 '지금의 상태'라 현재 기준 ±1초로 따로 판정한다. 선제 창으로 보면
  # 5초 안에 출발·전진하는 프레임이 정지·후진에서 빠졌다(검수 카드 13·16, STOP 348건).
  maneuver_state_window_s: 1.0
  # 회전·차선변경을 맵 확장(차로·교차로 폴리곤)으로 판정한다. 궤적만으로는 교차로를
  # 지나며 생긴 옆 이동이 차선변경으로, 큰 교차로 회전이 곡선로로 잡혔다.
  # 맵({dataroot}/maps/expansion)이 없으면 궤적 규칙(반경·횡이탈)으로 물러난다.
  use_map: true
  maneuver:
    stop_speed: 0.5
    turn_deg: 25.0
    # 반경 조건이 없으면 곡선로 주행이 전부 TURN이 된다. 도심 교차로 회전은
    # R≈6~25m인데 |Δψ|만 보면 R 50~70m 완만한 곡선까지 잡혔다(TURN 라벨의 43%가 R>30m).
    # 차로를 벗어나지 않는 곡선 주행에는 사각지대가 생기지 않으므로 STRAIGHT로 흡수한다.
    turn_radius_max: 30.0
    # 차선변경은 헤딩도 생(raw) 횡변위도 아닌 **곡선 성분을 뺀 잔차**로 판정한다.
    # 시작 헤딩 기준 횡변위는 차로를 그대로 따라가도 곡선로에서 커지기 때문이다
    # (반경 R을 θ만큼 돌면 R(1−cosθ)). 실측 scene-0105는 횡변위 1.81m 중 1.87m가
    # 곡선 성분이라 실제 차로 이탈이 0에 가까웠는데도 차선변경으로 잡혔다.
    lane_change_resid_min: 2.0
    lane_change_min_deg: 5.0
    lane_change_max_deg: 25.0
    lane_change_net_deg: 10.0
    enable_lane_change: true
